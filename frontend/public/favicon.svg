<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#c4023f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="#0d1117"/>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="url(#brandGradient)" stroke-width="3" opacity="0.5"/>

  <!-- S letterform -->
  <text x="118" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="150" font-weight="800" text-anchor="middle" fill="url(#brandGradient)">S</text>

  <!-- Sync accent: small looping arrow, top-right, symbolizing "sync" -->
  <g transform="translate(176,58)" stroke="url(#brandGradient)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M0,26 A26,26 0 1 1 22,-8"/>
  </g>
  <polygon points="22,-20 34,-9 16,-2" fill="url(#brandGradient)" transform="translate(176,58)"/>
</svg>
